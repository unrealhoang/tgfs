[workspace]
members = [
    ".",
    "vendor/rusqlite-from-row",
    "vendor/rusqlite-from-row-derive",
]
resolver = "2"

[workspace.dependencies]
rusqlite = { version = "0.40.1", features = ["fallible_uint"] }
rusqlite-from-row-derive = { path = "vendor/rusqlite-from-row-derive", version = "0.2.4" }

[package]
name = "tgfs"
version = "0.1.0"
edition = "2024"
description = "Use Telegram as a file storage / backup backend"
license = "MIT"
repository = "https://github.com/unrealhoang/tgfs"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
blake3 = "1.8.5"
chacha20poly1305 = "0.11.0"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6.0.0"
grammers-client = "0.10.0"
grammers-session = { version = "0.10.0", default-features = false }
grammers-tl-types = "0.10.0"
ignore = "0.4.23"
jwalk = "0.8.1"
rand = "0.10.2"
rpassword = "7.5.4"
rusqlite = { workspace = true, features = ["bundled"] }
rusqlite-from-row = { path = "vendor/rusqlite-from-row", version = "0.2.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal"] }
toml = "1.1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13.3"

# Planned (see docs/SPEC.md M5):
# fuser = "0.14"            # optional FUSE mount (feature-gated)

[features]
default = []
# mount = ["dep:fuser"]
