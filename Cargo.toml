[package]
name = "tgfs"
version = "0.1.0"
edition = "2024"
description = "Use Telegram as a file storage / backup backend"
license = "MIT"
repository = "https://github.com/unrealhoang/tgfs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Planned (see docs/SPEC.md):
# grammers-client = "0.7"   # MTProto client — 2 GiB (4 GiB premium) uploads
# rusqlite = "0.31"         # local metadata index
# fuser = "0.14"            # optional FUSE mount (feature-gated)

[features]
default = []
# mount = ["dep:fuser"]
